# Configuración del servidor de archivos (ver README.md). Se despliega con
#   npx wrangler deploy
name = "sound-check-pro-archivos"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Id del proyecto de Firebase (el token de cada persona se verifica contra él).
[vars]
FIREBASE_PROJECT_ID = "appbandasonido"
# Sitios que pueden subir y borrar desde un navegador (separados por coma).
# Espacio por cuenta en MB: normal y con la versión Pro (se baja el normal a
# 100 cuando Pro empiece a cobrarse; los archivos que ya estén no se borran).
CUOTA_GRATIS_MB = "500"
CUOTA_PRO_MB = "2048"
# Cuántos PDFs y secuencias puede tener una cuenta sin Pro (kMaxPdfsGratis y
# kMaxSecuenciasGratis en la app). Con Pro no hay límite.
LIMITE_PDFS_GRATIS = "4"
LIMITE_SECUENCIAS_GRATIS = "3"
DIAS_INACTIVO_INVITADO = "90"
BORRAR_ANONIMOS = "false"
ORIGENES_PERMITIDOS = "https://estebancastelani.github.io,http://localhost:5000"

# Limpieza de invitados: cada 10 días aproximadamente (días 1, 11 y 21 de cada
# mes, 08:00 UTC) borra las cuentas anónimas sin entrar hace DIAS_INACTIVO_INVITADO
# días. Necesita el secreto GOOGLE_SERVICE_ACCOUNT (npx wrangler secret put
# GOOGLE_SERVICE_ACCOUNT). Mientras BORRAR_ANONIMOS no sea "true" solo lista.
[triggers]
crons = ["0 8 1,11,21 * *"]

# Bucket de R2 donde viven los archivos (se crea en el panel de Cloudflare).
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "sound-check-pro-archivos"

# Base D1 con las copias y los enlaces por cuenta (se crea en el panel de
# Cloudflare y se le carga schema.sql; ver README.md). Reemplazar database_id.
[[d1_databases]]
binding = "DB"
database_name = "sound-check-pro-archivos"
database_id = "23943641-cd1d-4017-a6af-a232f85c9705"
