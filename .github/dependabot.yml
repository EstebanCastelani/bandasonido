# Propone actualizaciones de dependencias como pull requests; cada una pasa
# por la CI (formato, análisis y pruebas) antes de poder unirse a main.
# Ver OPERACION.md ("Dependencias") para el estado actual.
version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci"
