name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag o rama a publicar. Para VOLVER A UNA VERSIÓN ANTERIOR poné su tag (ej. v1.1.0). Vacío = main"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Control de calidad previo a publicar (QA): si algo de esto falla, no se
  # construye ni se publica nada. Ver AUDITORIA_TESTING.md y REQUISITOS.md.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      # Formato uniforme (evita diferencias de estilo y ediciones frágiles).
      # No incluye lib/l10n: ahí hay archivos generados por flutter gen-l10n.
      - name: Check formatting
        working-directory: frontend
        run: dart format --output=none --set-exit-if-changed lib/main.dart lib/puente_web.dart test

      # Falla ante errores y warnings; los avisos informativos (infos) no
      # bloquean por ahora (ver AUDITORIA_TESTING.md).
      - name: Analyze
        working-directory: frontend
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: frontend
        run: flutter test

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build web
        working-directory: frontend
        run: flutter build web --release --base-href /bandasonido/

      - name: Disable Jekyll processing
        run: touch frontend/build/web/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build/web

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # APAGADO por defecto. Para activarlo: en GitHub → Settings → Secrets and
  # variables → Actions, crear el secreto GOOGLE_SERVICES_JSON (contenido de
  # frontend/android/app/google-services.json) y la variable ANDROID_BUILD=true.
  # Genera un APK de depuración como artefacto (no está firmado para publicar).
  android:
    needs: test
    if: ${{ vars.ANDROID_BUILD == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > frontend/android/app/google-services.json

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build APK (debug)
        working-directory: frontend
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: sound-check-pro-debug-apk
          path: frontend/build/app/outputs/flutter-apk/app-debug.apk
