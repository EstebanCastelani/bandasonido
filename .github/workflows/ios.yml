# Compilación de prueba para iPhone (sin firmar). Se lanza a mano desde la pestaña Actions.
# Sirve para saber si la app compila en iOS sin tener una Mac. No publica nada.
name: iOS (compilación de prueba)
on: workflow_dispatch
jobs:
  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
