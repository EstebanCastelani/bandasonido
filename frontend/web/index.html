<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Pedidos en vivo entre músicos y sonidista, setlist, cifrados y secuencias para ensayos y shows.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0B1E">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Sound Check">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Sound Check Pro</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="background:#0A0B1E;margin:0">
  <!-- Indicador de carga: se quita cuando Flutter dibuja el primer cuadro. -->
  <div id="carga" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0A0B1E;color:#9fb3c8;font-family:sans-serif;z-index:10">
    <div style="width:36px;height:36px;border:4px solid #1c2a3a;border-top-color:#13c8dc;border-radius:50%;animation:giro 0.9s linear infinite"></div>
    <div style="margin-top:14px;font-size:14px;letter-spacing:1px">SOUND CHECK PRO</div>
  </div>
  <style>@keyframes giro{to{transform:rotate(360deg)}}</style>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var c = document.getElementById('carga');
      if (c) c.remove();
    });
  </script>
  <!-- Requerido por syncfusion_flutter_pdfviewer para renderizar PDFs en
       Web (SfPdfViewer.network/.memory no funcionan sin esto — ver
       CONTEXTO_PARA_IA.md, sección de deuda de Storage/Supabase). -->
  <!-- async: si cdnjs tarda o no responde, la app arranca igual (solo los PDFs
       esperan). El worker se configura cuando el script termina de cargar. -->
  <script async
          src="//cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"
          onload="pdfjsLib.GlobalWorkerOptions.workerSrc = '//cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js';"></script>

  <!-- Conversión a MP3 de las secuencias que pasan el límite de Supabase
       (usa lame.min.js desde conversor_mp3_worker.js — ver
       lib/puente_web.dart). -->
  <script src="conversor_mp3.js"></script>
  <!-- PDF y audios de la sala guardados en el navegador para usarlos sin red
       (ver lib/puente_web.dart). Va antes del reproductor. -->
  <script src="cache_archivos.js"></script>
  <!-- Reproductor de secuencias con tono, tempo y volumen (ver
       lib/puente_web.dart). Carga procesador_tono.js (SoundTouch en el
       hilo de audio); es módulo para resolver esa ruta con import.meta. -->
  <script type="module" src="reproductor_secuencias.js"></script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
