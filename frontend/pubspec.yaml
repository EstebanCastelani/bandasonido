name: appsonido_frontend
description: MVP multiplataforma para AppSonido
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  google_sign_in: ^6.2.1
  shared_preferences: ^2.5.5
  file_picker: ^8.1.2
  syncfusion_flutter_pdfviewer: ^27.1.58
  syncfusion_flutter_pdf: ^27.1.58
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
