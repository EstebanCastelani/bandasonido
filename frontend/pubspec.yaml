name: appsonido_frontend
description: MVP multiplataforma para AppSonido
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_app_check: ^0.3.1
  google_sign_in: ^6.2.1
  shared_preferences: ^2.5.5
  file_picker: ^8.1.2
  syncfusion_flutter_pdfviewer: ^27.1.58
  syncfusion_flutter_pdf: ^27.1.58
  wakelock_plus: ^1.2.8
  audioplayers: ^6.1.0
  share_plus: ^10.1.2
  supabase_flutter: ^2.8.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/pedido_nuevo.wav
    # Fondo de la pantalla de presentación (BienvenidaScreen). Si no hay
    # imagen, la pantalla dibuja un fondo propio.
    - assets/images/
  # Fuente de ancho fijo para los cifrados: la versión web (CanvasKit) no
  # puede usar la fuente genérica "monospace" del sistema, y sin ancho fijo
  # los acordes no quedan alineados con la letra.
  fonts:
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf
